<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Focused Editor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary:                    "#3525cd",
          "primary-container":        "#4f46e5",
          "on-primary":               "#ffffff",
          "surface":                  "#f7f9fc",
          "surface-container":        "#eceef1",
          "surface-container-low":    "#f2f4f7",
          "surface-container-high":   "#e6e8eb",
          "surface-container-highest":"#e0e3e6",
          "surface-container-lowest": "#ffffff",
          "on-surface":               "#191c1e",
          "on-surface-variant":       "#464555",
          "outline-variant":          "#c7c4d8",
          "tertiary":                 "#960014",
          "tertiary-fixed":           "#ffdad7",
          "on-tertiary-fixed-variant":"#930013",
          "secondary":                "#855300",
          "secondary-fixed":          "#ffddb8",
          "on-secondary-fixed-variant":"#653e00",
          "error":                    "#ba1a1a",
        },
        fontFamily: { sans: ["Inter"] },
      }
    }
  }
</script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
  }
  body { font-family: 'Inter', sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%      { transform: translateX(-6px); }
    75%      { transform: translateX(6px); }
  }
  .shake { animation: shake 0.3s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .task-item { animation: fadeIn 0.2s ease; }

  #confetti-canvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }

  /* Sidebar scrollable */
  .sidebar { height: calc(100vh - 64px); overflow-y: auto; }
  .main-scroll { height: calc(100vh - 64px); overflow-y: auto; }
</style>
</head>
<body class="bg-surface text-on-surface min-h-screen">

<canvas id="confetti-canvas"></canvas>

<!-- ═══════════════════════════════════════════ TOP NAV ══ -->
<header class="sticky top-0 z-50 bg-white/90 dark:bg-gray-900/90 backdrop-blur border-b border-outline-variant/20 h-16 flex items-center px-8 gap-6">
  <h1 class="text-xl font-extrabold tracking-tight text-primary">Focused Editor</h1>

  <!-- Search bar -->
  <div class="flex-1 max-w-xl relative">
    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
    <input id="search-input" type="text" placeholder="Search tasks…" oninput="render()"
      class="w-full bg-surface-container rounded-full pl-9 pr-4 py-2 text-sm text-on-surface placeholder-on-surface-variant/60 focus:outline-none focus:ring-2 focus:ring-primary/25 transition-all"/>
  </div>

  <div class="flex items-center gap-2 ml-auto">
    <!-- Sort -->
    <select id="sort-select" onchange="render()"
      class="bg-surface-container border-none rounded-full px-4 py-2 text-xs font-bold text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary/20 cursor-pointer">
      <option value="created">Newest First</option>
      <option value="priority">By Priority</option>
      <option value="dueDate">By Due Date</option>
    </select>

    <!-- Dark mode -->
    <button onclick="toggleDark()" id="dark-btn"
      class="p-2 rounded-full hover:bg-surface-container transition-colors text-on-surface-variant" title="Toggle dark mode">
      <span class="material-symbols-outlined" id="dark-icon">dark_mode</span>
    </button>
  </div>
</header>

<!-- ═══════════════════════════════════════════ LAYOUT ══ -->
<div class="flex max-w-screen-xl mx-auto">

  <!-- ─────────────────────── LEFT SIDEBAR ── -->
  <aside class="sidebar w-72 shrink-0 border-r border-outline-variant/20 px-6 py-8 space-y-8 sticky top-16">

    <!-- Progress -->
    <div class="space-y-3">
      <div class="flex justify-between items-end">
        <span class="text-[0.6875rem] font-bold uppercase tracking-widest text-on-surface-variant">Progress</span>
        <span class="text-2xl font-extrabold text-primary" id="pct-label">0%</span>
      </div>
      <div class="h-2.5 bg-surface-container rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-primary to-primary-container rounded-full transition-all duration-500" style="width:0%"></div>
      </div>
      <p class="text-xs text-on-surface-variant" id="remaining-label">0 tasks remaining</p>
    </div>

    <!-- Stats cards -->
    <div class="space-y-3">
      <span class="text-[0.6875rem] font-bold uppercase tracking-widest text-on-surface-variant">Priority Breakdown</span>
      <div class="space-y-2 mt-2">
        <div class="flex items-center gap-3 bg-surface-container-lowest rounded-xl p-3 border border-outline-variant/10 shadow-sm">
          <span class="material-symbols-outlined text-tertiary" style="font-variation-settings:'FILL' 1;">priority_high</span>
          <div>
            <p class="text-xl font-bold text-on-surface" id="stat-high">0</p>
            <p class="text-[10px] uppercase font-bold text-on-surface-variant tracking-wider">High</p>
          </div>
        </div>
        <div class="flex items-center gap-3 bg-surface-container-lowest rounded-xl p-3 border border-outline-variant/10 shadow-sm">
          <span class="material-symbols-outlined text-secondary" style="font-variation-settings:'FILL' 1;">fiber_manual_record</span>
          <div>
            <p class="text-xl font-bold text-on-surface" id="stat-medium">0</p>
            <p class="text-[10px] uppercase font-bold text-on-surface-variant tracking-wider">Medium</p>
          </div>
        </div>
        <div class="flex items-center gap-3 bg-surface-container-lowest rounded-xl p-3 border border-outline-variant/10 shadow-sm">
          <span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings:'FILL' 1;">low_priority</span>
          <div>
            <p class="text-xl font-bold text-on-surface" id="stat-low">0</p>
            <p class="text-[10px] uppercase font-bold text-on-surface-variant tracking-wider">Low</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="space-y-2">
      <span class="text-[0.6875rem] font-bold uppercase tracking-widest text-on-surface-variant">Filter</span>
      <div class="flex flex-col gap-1 mt-2" id="filter-bar">
        <button onclick="setFilter('all',this)"    class="filter-btn active text-left px-4 py-2.5 rounded-xl text-sm font-semibold bg-primary text-on-primary transition-all">All Tasks</button>
        <button onclick="setFilter('active',this)" class="filter-btn text-left px-4 py-2.5 rounded-xl text-sm font-semibold text-on-surface-variant hover:bg-surface-container transition-all">Active</button>
        <button onclick="setFilter('done',this)"   class="filter-btn text-left px-4 py-2.5 rounded-xl text-sm font-semibold text-on-surface-variant hover:bg-surface-container transition-all">Completed</button>
        <button onclick="setFilter('high',this)"   class="filter-btn text-left px-4 py-2.5 rounded-xl text-sm font-semibold text-on-surface-variant hover:bg-surface-container transition-all flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-tertiary inline-block"></span>High Priority</button>
        <button onclick="setFilter('medium',this)" class="filter-btn text-left px-4 py-2.5 rounded-xl text-sm font-semibold text-on-surface-variant hover:bg-surface-container transition-all flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-secondary inline-block"></span>Medium Priority</button>
        <button onclick="setFilter('low',this)"    class="filter-btn text-left px-4 py-2.5 rounded-xl text-sm font-semibold text-on-surface-variant hover:bg-surface-container transition-all flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-on-surface-variant inline-block"></span>Low Priority</button>
      </div>
    </div>

    <!-- Clear completed -->
    <button onclick="clearDone()" class="w-full text-center text-xs font-bold uppercase tracking-widest text-on-surface-variant hover:text-error transition-colors py-2">
      Clear Completed
    </button>
  </aside>

  <!-- ─────────────────────── MAIN CONTENT ── -->
  <main class="main-scroll flex-1 px-8 py-8 space-y-6">

    <!-- Page title + count -->
    <div class="flex justify-between items-end">
      <div>
        <span class="text-[0.6875rem] font-bold uppercase tracking-widest text-on-surface-variant">Overview</span>
        <h2 class="text-4xl font-extrabold tracking-tight text-on-surface mt-1">My Tasks</h2>
      </div>
      <span id="count-label" class="text-sm font-bold text-on-surface-variant pb-1">0 items total</span>
    </div>

    <!-- Add task card -->
    <div class="bg-surface-container rounded-2xl p-6 space-y-4">
      <input id="new-todo" type="text" maxlength="200" placeholder="What needs to be done?"
        class="w-full bg-surface-container-lowest rounded-xl px-5 py-4 text-on-surface placeholder-on-surface-variant/50 text-lg font-medium focus:outline-none focus:ring-2 focus:ring-primary/20 shadow-sm transition-all"/>
      <div class="flex gap-3 items-center flex-wrap">
        <select id="priority-select"
          class="flex-1 min-w-[160px] appearance-none bg-surface-container-high rounded-xl px-4 py-3 text-sm font-semibold text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary/20 cursor-pointer">
          <option value="medium">Priority: Medium</option>
          <option value="high">Priority: High</option>
          <option value="low">Priority: Low</option>
        </select>
        <input id="due-date" type="date"
          class="flex-1 min-w-[160px] bg-surface-container-high rounded-xl px-4 py-3 text-sm font-semibold text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary/20"/>
        <button onclick="addTodo()"
          class="flex items-center gap-2 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold px-8 py-3 rounded-full shadow-lg shadow-primary/20 hover:shadow-primary/30 active:scale-[0.98] transition-all group">
          <span class="material-symbols-outlined text-lg transition-transform group-hover:rotate-90">add</span>
          Add to Editor
        </button>
      </div>
    </div>

    <!-- Task list -->
    <div class="space-y-2" id="todo-list"></div>

    <!-- Empty state -->
    <div id="empty-msg" class="hidden flex-col items-center justify-center py-24 text-center">
      <div class="w-32 h-32 bg-surface-container-high rounded-full flex items-center justify-center mx-auto mb-5">
        <span class="material-symbols-outlined text-5xl text-primary/20">task_alt</span>
      </div>
      <h4 class="text-xl font-bold text-on-surface mb-1">No tasks here</h4>
      <p id="empty-text" class="text-on-surface-variant text-sm max-w-xs">Add one above to begin your editorial journey.</p>
    </div>

  </main>
</div>

<!-- Ambient decorations -->
<div class="fixed top-1/4 -right-16 w-72 h-72 bg-error/5 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="fixed bottom-1/4 -left-16 w-56 h-56 bg-primary/5 rounded-full blur-3xl pointer-events-none -z-10"></div>

<script>
  // ── Storage ──
  function loadS(k,f){ try{ return JSON.parse(localStorage.getItem(k))??f; }catch{ return f; } }
  function saveS(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }

  // ── State ──
  let todos    = loadS('todos', []);
  let settings = loadS('settings', { darkMode: false });
  let filter   = 'all';

  if (settings.darkMode) {
    document.documentElement.classList.add('dark');
    document.getElementById('dark-icon').textContent = 'light_mode';
  }

  function save(){ saveS('todos', todos); }

  // ── Render ──
  function render(){
    const list      = document.getElementById('todo-list');
    const empty     = document.getElementById('empty-msg');
    const emptyText = document.getElementById('empty-text');
    const search    = (document.getElementById('search-input').value||'').trim().toLowerCase();
    const sortBy    = document.getElementById('sort-select').value;
    const today     = new Date().toISOString().split('T')[0];

    let visible = todos.filter(t => {
      if (filter==='active')  return !t.done;
      if (filter==='done')    return t.done;
      if (filter==='high')    return t.priority==='high';
      if (filter==='medium')  return t.priority==='medium';
      if (filter==='low')     return t.priority==='low';
      return true;
    });
    if (search) visible = visible.filter(t => t.text.toLowerCase().includes(search));

    const pOrd = {high:0,medium:1,low:2};
    if (sortBy==='priority')  visible.sort((a,b)=>pOrd[a.priority]-pOrd[b.priority]);
    else if (sortBy==='dueDate') visible.sort((a,b)=>{ if(!a.dueDate)return 1; if(!b.dueDate)return -1; return a.dueDate.localeCompare(b.dueDate); });
    else visible.sort((a,b)=>b.id-a.id);

    const borderCls = { high:'border-tertiary', medium:'border-secondary', low:'border-on-surface-variant' };
    const badgeCls  = { high:'bg-tertiary-fixed text-on-tertiary-fixed-variant', medium:'bg-secondary-fixed text-on-secondary-fixed-variant', low:'bg-surface-container-highest text-on-surface-variant' };

    list.innerHTML = visible.map(t => {
      const isOverdue = !t.done && t.dueDate && t.dueDate < today;
      const isToday   = t.dueDate === today;

      let metaHtml = '';
      if (t.dueDate) {
        if (isOverdue) metaHtml = `<span class="flex items-center gap-1 text-xs font-semibold text-error"><span class="material-symbols-outlined text-sm" style="font-variation-settings:'FILL' 1;">flag</span>Overdue • ${fmt(t.dueDate)}</span>`;
        else if (isToday) metaHtml = `<span class="flex items-center gap-1 text-xs font-semibold text-primary"><span class="material-symbols-outlined text-sm">calendar_today</span>Today</span>`;
        else metaHtml = `<span class="flex items-center gap-1 text-xs text-on-surface-variant"><span class="material-symbols-outlined text-sm">calendar_today</span>${fmt(t.dueDate)}</span>`;
      }

      const checkInner = t.done
        ? `<span class="material-symbols-outlined text-on-primary text-sm" style="font-variation-settings:'FILL' 1;">check</span>`
        : '';
      const checkCls = t.done ? 'bg-primary border-primary' : 'border-2 border-primary bg-transparent';
      const highGlow = t.priority==='high' && !t.done ? 'shadow-sm bg-error/[0.02]' : 'bg-surface-container-lowest';

      return `
        <div class="task-item group ${highGlow} rounded-xl border-l-4 ${borderCls[t.priority]} flex items-center gap-4 px-5 py-4 transition-all hover:shadow-md ${t.done?'opacity-60':''}" id="item-${t.id}">
          <button onclick="toggle(${t.id})" class="w-6 h-6 shrink-0 rounded-full ${checkCls} flex items-center justify-center transition-all hover:scale-110">${checkInner}</button>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-3 flex-wrap">
              <span class="font-bold text-on-surface text-base ${t.done?'line-through decoration-primary decoration-2 text-on-surface-variant':''} cursor-pointer"
                    ondblclick="startEdit(${t.id})" title="Double-click to edit">${esc(t.text)}</span>
              <span class="px-2 py-0.5 rounded-md ${badgeCls[t.priority]} text-[10px] font-bold uppercase tracking-wider">${t.priority}</span>
              ${metaHtml}
            </div>
          </div>
          <button onclick="remove(${t.id})" class="opacity-0 group-hover:opacity-100 p-1.5 rounded-lg text-on-surface-variant hover:text-error hover:bg-error/10 transition-all">
            <span class="material-symbols-outlined text-[18px]">close</span>
          </button>
        </div>`;
    }).join('');

    const noTasks = visible.length === 0;
    empty.style.display = noTasks ? 'flex' : 'none';
    if (noTasks) emptyText.textContent = search ? `No tasks match "${search}"` : filter==='done' ? 'No completed tasks yet.' : 'Add one above to begin your editorial journey.';

    const total     = todos.length;
    const done      = todos.filter(t=>t.done).length;
    const remaining = total - done;
    const pct       = total===0 ? 0 : Math.round((done/total)*100);

    document.getElementById('progress-bar').style.width    = pct+'%';
    document.getElementById('pct-label').textContent       = pct+'%';
    document.getElementById('stat-high').textContent       = todos.filter(t=>t.priority==='high'   && !t.done).length;
    document.getElementById('stat-medium').textContent     = todos.filter(t=>t.priority==='medium' && !t.done).length;
    document.getElementById('stat-low').textContent        = todos.filter(t=>t.priority==='low'    && !t.done).length;
    document.getElementById('count-label').textContent     = `${total} item${total!==1?'s':''} total`;
    document.getElementById('remaining-label').textContent = `${remaining} task${remaining!==1?'s':''} remaining`;

    if (total>0 && done===total) launchConfetti();
  }

  function fmt(d){ const [y,m,day]=d.split('-'); return `${day}/${m}/${y}`; }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── Add ──
  function addTodo(){
    const input    = document.getElementById('new-todo');
    const priority = document.getElementById('priority-select').value;
    const dueDate  = document.getElementById('due-date').value;
    const text     = input.value.trim();
    if (!text){
      input.classList.add('shake','ring-2','ring-error/50');
      setTimeout(()=>input.classList.remove('shake','ring-2','ring-error/50'), 600);
      return;
    }
    todos.push({ id:Date.now(), text, done:false, priority, dueDate, createdAt:Date.now() });
    input.value='';
    document.getElementById('due-date').value='';
    save(); render();
  }

  function toggle(id){ const t=todos.find(t=>t.id===id); if(t) t.done=!t.done; save(); render(); }
  function remove(id){ todos=todos.filter(t=>t.id!==id); save(); render(); }
  function clearDone(){ todos=todos.filter(t=>!t.done); save(); render(); }

  // ── Inline edit ──
  function startEdit(id){
    const t=todos.find(t=>t.id===id);
    const item=document.getElementById('item-'+id);
    const span=item.querySelector('span[ondblclick]');
    const orig=t.text;
    const inp=document.createElement('input');
    inp.type='text'; inp.value=orig; inp.maxLength=200;
    inp.className='flex-1 bg-surface-container-lowest border border-primary/30 rounded-lg px-3 py-1 text-base font-bold text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/20';
    span.replaceWith(inp); inp.focus(); inp.select();
    function commit(){ const v=inp.value.trim(); if(v&&v!==orig){t.text=v;save();} render(); }
    inp.addEventListener('blur',commit);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){inp.removeEventListener('blur',commit);commit();} if(e.key==='Escape'){inp.removeEventListener('blur',commit);render();} });
  }

  // ── Filter ──
  function setFilter(f,btn){
    filter=f;
    document.querySelectorAll('.filter-btn').forEach(b=>{
      b.classList.remove('bg-primary','text-on-primary');
      b.classList.add('text-on-surface-variant','hover:bg-surface-container');
    });
    btn.classList.add('bg-primary','text-on-primary');
    btn.classList.remove('text-on-surface-variant','hover:bg-surface-container');
    render();
  }

  // ── Dark mode ──
  function toggleDark(){
    settings.darkMode=!settings.darkMode;
    document.documentElement.classList.toggle('dark',settings.darkMode);
    document.getElementById('dark-icon').textContent=settings.darkMode?'light_mode':'dark_mode';
    saveS('settings',settings);
  }

  // ── Confetti ──
  let confettiRunning=false;
  function launchConfetti(){
    if(confettiRunning)return; confettiRunning=true;
    const canvas=document.getElementById('confetti-canvas');
    const ctx=canvas.getContext('2d');
    canvas.width=window.innerWidth; canvas.height=window.innerHeight;
    const colors=['#3525cd','#ba1a1a','#fea619','#22c55e','#ec4899','#06b6d4'];
    const pieces=Array.from({length:140},()=>({ x:Math.random()*canvas.width, y:Math.random()*-canvas.height, w:Math.random()*10+5, h:Math.random()*6+4, color:colors[Math.floor(Math.random()*colors.length)], vx:(Math.random()-.5)*3, vy:Math.random()*3+2, rot:Math.random()*360, vr:(Math.random()-.5)*6 }));
    let frame=0;
    function draw(){ ctx.clearRect(0,0,canvas.width,canvas.height); pieces.forEach(p=>{ ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore(); p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr; }); frame++; if(frame<160)requestAnimationFrame(draw); else{ctx.clearRect(0,0,canvas.width,canvas.height);confettiRunning=false;} }
    draw();
  }

  document.getElementById('new-todo').addEventListener('keydown',e=>{ if(e.key==='Enter')addTodo(); });
  render();
</script>
</body>
</html>
