<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      height: fit-content;
      overflow: hidden;
    }

    header {
      background: #4f46e5;
      color: white;
      padding: 24px;
    }

    header h1 { font-size: 1.5rem; }
    header p { font-size: 0.85rem; opacity: 0.8; margin-top: 4px; }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 16px;
      border-bottom: 1px solid #e5e7eb;
      flex-wrap: wrap;
    }

    .input-area input[type="text"] {
      flex: 1;
      min-width: 140px;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input[type="text"]:focus { border-color: #4f46e5; }

    .priority-select {
      padding: 10px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      background: white;
      color: #374151;
    }

    .input-area button {
      padding: 10px 18px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-area button:hover { background: #4338ca; }

    .filters {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      flex-wrap: wrap;
    }

    .filters button {
      padding: 6px 14px;
      border: 1px solid #d1d5db;
      border-radius: 20px;
      background: white;
      font-size: 0.8rem;
      cursor: pointer;
      color: #6b7280;
      transition: all 0.2s;
    }

    .filters button.active {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }

    .todo-list { list-style: none; }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #f3f4f6;
      border-left: 4px solid transparent;
      transition: background 0.15s;
    }

    .todo-item:hover { background: #f9fafb; }

    .todo-item.priority-high   { border-left-color: #ef4444; }
    .todo-item.priority-medium { border-left-color: #f59e0b; }
    .todo-item.priority-low    { border-left-color: #22c55e; }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4f46e5;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-item .text-wrap {
      flex: 1;
      min-width: 0;
    }

    .todo-item .task-text {
      font-size: 0.95rem;
      color: #111827;
      word-break: break-word;
    }

    .todo-item .task-text.done {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .priority-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 10px;
      margin-top: 4px;
    }

    .badge-high   { background: #fee2e2; color: #b91c1c; }
    .badge-medium { background: #fef3c7; color: #b45309; }
    .badge-low    { background: #dcfce7; color: #15803d; }

    .todo-item .delete-btn {
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s;
      flex-shrink: 0;
    }

    .todo-item .delete-btn:hover { color: #ef4444; }

    .empty {
      text-align: center;
      padding: 40px 16px;
      color: #9ca3af;
      font-size: 0.9rem;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    footer button {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.8rem;
      cursor: pointer;
    }

    footer button:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Todo List</h1>
      <p id="summary">0 tasks remaining</p>
    </header>

    <div class="input-area">
      <input type="text" id="new-todo" placeholder="Add a new task..." maxlength="200">
      <select class="priority-select" id="priority-select">
        <option value="medium">Medium</option>
        <option value="high">High</option>
        <option value="low">Low</option>
      </select>
      <button onclick="addTodo()">Add</button>
    </div>

    <div class="filters">
      <button class="active" onclick="setFilter('all', this)">All</button>
      <button onclick="setFilter('active', this)">Active</button>
      <button onclick="setFilter('done', this)">Done</button>
      <button onclick="setFilter('high', this)">High</button>
      <button onclick="setFilter('medium', this)">Medium</button>
      <button onclick="setFilter('low', this)">Low</button>
    </div>

    <ul class="todo-list" id="todo-list"></ul>

    <div class="empty" id="empty-msg" style="display:none">No tasks here.</div>

    <footer>
      <span id="count-label"></span>
      <button onclick="clearDone()">Clear completed</button>
    </footer>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    let filter = 'all';

    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function render() {
      const list = document.getElementById('todo-list');
      const empty = document.getElementById('empty-msg');

      const visible = todos.filter(t => {
        if (filter === 'all') return true;
        if (filter === 'active') return !t.done;
        if (filter === 'done') return t.done;
        return t.priority === filter;
      });

      list.innerHTML = visible.map(t => `
        <li class="todo-item priority-${t.priority || 'medium'}">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggle(${t.id})">
          <div class="text-wrap">
            <div class="task-text ${t.done ? 'done' : ''}">${escape(t.text)}</div>
            <span class="priority-badge badge-${t.priority || 'medium'}">${t.priority || 'medium'}</span>
          </div>
          <button class="delete-btn" onclick="remove(${t.id})" title="Delete">&#10005;</button>
        </li>
      `).join('');

      empty.style.display = visible.length === 0 ? 'block' : 'none';

      const remaining = todos.filter(t => !t.done).length;
      document.getElementById('summary').textContent =
        `${remaining} task${remaining !== 1 ? 's' : ''} remaining`;
      document.getElementById('count-label').textContent =
        `${todos.length} total`;
    }

    function escape(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function addTodo() {
      const input = document.getElementById('new-todo');
      const priority = document.getElementById('priority-select').value;
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: Date.now(), text, done: false, priority });
      input.value = '';
      save();
      render();
    }

    function toggle(id) {
      const t = todos.find(t => t.id === id);
      if (t) t.done = !t.done;
      save();
      render();
    }

    function remove(id) {
      todos = todos.filter(t => t.id !== id);
      save();
      render();
    }

    function clearDone() {
      todos = todos.filter(t => !t.done);
      save();
      render();
    }

    function setFilter(f, btn) {
      filter = f;
      document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    document.getElementById('new-todo').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTodo();
    });

    render();
  </script>
</body>
</html>
